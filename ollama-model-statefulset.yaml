apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ollama-model
  namespace: remmanuel
  labels:
    app: ollama-model
spec:
  serviceName: ollama-model-headless-service
  replicas: 3
  selector:
    matchLabels:
      app: ollama-model
  template:
    metadata:
      labels:
        app: ollama-model
    spec:
      nodeSelector:
        nvidia.com/gpu: "true"
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: ollama-server
          image: lionzwarrior10/custom-ollama:latest
          ports:
            - containerPort: 11434
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "8000m"
              memory: "16Gi"
            requests:
              nvidia.com/gpu: 1
              cpu: "4000m"
              memory: "8Gi"
