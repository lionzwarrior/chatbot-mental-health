apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: remmanuel
spec:
  serviceName: qdrant-headless-service
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
        - containerPort: 6334
        volumeMounts:
        - name: qdrant-persistent-storage
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: qdrant-persistent-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
      volumeName: qdrant-nas-pv-remmanuel