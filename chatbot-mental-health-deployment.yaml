apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-mental-health
  labels:
    app: chatbot-mental-health
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot-mental-health
  template:
    metadata:
      labels:
        app: chatbot-mental-health
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: chatbot
        image: lionzwarrior10/chatbot-mental-health:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8501
          name: streamlit-http
          protocol: TCP
        - containerPort: 8000
          name: metrics-http
          protocol: TCP
        env:
        - name: MONGO_URI
          value: "mongodb://mongodb-service:27017"
        - name: QDRANT_URL
          value: "http://qdrant-service:6333"
        - name: OLLAMA_URL
          value: "http://ollama-model-service:11434"
        - name: OLLAMA_NUM_CTX
          valueFrom:
            configMapKeyRef:
              name: ollama-config
              key: num_ctx
        resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"

