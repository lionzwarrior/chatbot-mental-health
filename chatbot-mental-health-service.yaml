apiVersion: v1
kind: Service
metadata:
  name: chatbot-mental-health-service
  labels:
    app: chatbot-mental-health
spec:
  selector:
    app: chatbot-mental-health
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: streamlit-http
    - protocol: TCP
      port: 8000
      targetPort: 8000
      name: metrics-http
  type: ClusterIP